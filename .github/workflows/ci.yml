name: 4PLAY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check room-mode.js
          node --check room-tv-client.js
          node --check room-qr.js
          node --check room-entry.js
          node --check tv-mode.js
          node --check logic-data.js
          node --check logic-tv.js
          node --check logic-phone.js
          node --check logic-audio.js
          node --check logic-qr-scan.js
          node --check logic-answer-check.js
          node --check player-profile.js
          node --check sw.js
          node --check supabase-config.js

      - name: Check Logic question pack
        run: |
          node scripts/test-logic.cjs
          node scripts/test-logic-answers.cjs
          node scripts/test-logic-testbot.cjs
          node scripts/test-logic-qr.cjs

      - name: Validate card JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path('data').glob('*.json'):
              with path.open(encoding='utf-8') as f:
                  json.load(f)
              print('OK', path)
          PY
